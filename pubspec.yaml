name: todo_app
description: A To-Do List App with Firebase Authentication and State Management.

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  google_sign_in: ^6.2.1
  provider: ^6.1.2
  http: ^1.2.1
  shared_preferences: ^2.2.3
  cupertino_icons: ^1.0.6
  fluttertoast: ^8.2.5
  uuid: ^4.4.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true